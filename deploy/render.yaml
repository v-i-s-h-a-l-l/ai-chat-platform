# Render blueprint — combined API + worker, managed Postgres/Redis, external Qdrant.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect repo → Blueprint path: deploy/render.yaml

services:
  - type: web
    name: yellobot-api
    runtime: docker
    dockerfilePath: Dockerfile.production
    dockerContext: backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: yellobot-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: yellobot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: yellobot-redis
          type: redis
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: RERANK_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: RATE_LIMIT_USE_REDIS
        value: "true"
      - key: INGESTION_INLINE_FALLBACK
        value: "false"
      - key: RAG_ENABLED
        value: "true"
      - key: METRICS_ENABLED
        value: "true"
      - key: METRICS_TOKEN
        generateValue: true
      - key: DOCUMENT_STORAGE_PATH
        value: /app/storage/documents
      - key: INGESTION_MAX_JOBS
        value: "2"

  - type: redis
    name: yellobot-redis
    plan: starter
    ipAllowList: []

databases:
  - name: yellobot-postgres
    plan: starter
    databaseName: chatbot_db
    user: chatbot
