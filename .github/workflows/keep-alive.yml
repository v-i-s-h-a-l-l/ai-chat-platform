# Ping the production Render API every 5 minutes to reduce cold-start delays
# on register/login. Override the URL via repo variable RENDER_HEALTH_URL if needed.
name: Keep API warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render health
    runs-on: ubuntu-latest
    steps:
      - name: Wake production API
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://ai-chat-platform-irvb.onrender.com/health}"
          echo "Pinging ${URL}"
          curl -fsS --retry 2 --retry-delay 10 --max-time 60 "${URL}"
